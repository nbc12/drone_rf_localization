id: aoa_switch_sync
label: AOA Switch Sync Demux
category: '[AOA]'

templates:
  imports: from gnuradio import aoa
  make: >
    aoa.switch_sync(
        sample_rate=${sample_rate},
        dwell_time=${dwell_time},
        num_antennas=${num_antennas},
        threshold_percentile=${threshold_percentile}
    )

parameters:
- id: sample_rate
  label: Sample Rate
  dtype: float
  default: 10000000

- id: dwell_time
  label: Dwell Time (s)
  dtype: float
  default: 45e-6

- id: num_antennas
  label: Number of Antennas
  dtype: int
  default: 6

- id: threshold_percentile
  label: Threshold Percentile (0-100)
  dtype: float
  default: 10.0

inputs:
- label: in
  domain: stream
  dtype: complex

outputs:
- label: ant1
  domain: stream
  dtype: complex
- label: ant2
  domain: stream
  dtype: complex
- label: ant3
  domain: stream
  dtype: complex
- label: ant4
  domain: stream
  dtype: complex
- label: ant5
  domain: stream
  dtype: complex
- label: ant6
  domain: stream
  dtype: complex
- label: dead
  domain: stream
  dtype: complex

file_format: 1