id: aoa_demux
label: AOA Demux
category: '[AOA]'

templates:
  imports: from gnuradio import aoa
  make: aoa.demux(sample_rate=${sample_rate}, dwell_time=${dwell_time}, num_antennas=${num_antennas})

parameters:
- id: sample_rate
  label: Sample Rate
  dtype: int
  default: 1000000
- id: dwell_time
  label: Dwell Time (s)
  dtype: float
  default: 0.5
- id: num_antennas
  label: Num Antennas
  dtype: int
  default: 6

inputs:
- label: iq_in
  domain: stream
  dtype: complex
- label: clk_in
  domain: stream
  dtype: float

outputs:
- label: ant1
  domain: stream
  dtype: complex
- label: ant2
  domain: stream
  dtype: complex
- label: ant3
  domain: stream
  dtype: complex
- label: ant4
  domain: stream
  dtype: complex
- label: ant5
  domain: stream
  dtype: complex
- label: ant6
  domain: stream
  dtype: complex
- label: dead_time
  domain: stream
  dtype: complex

file_format: 1
